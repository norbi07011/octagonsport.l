<html lang="nl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OctagonSportNL | Octagon Fightwear & Vechtsport Uitrusting</title>

    <meta property="og:title" content="OctagonSportNL | Octagon Fightwear & Vechtsport Uitrusting" />
    <meta property="og:description" content="Fightwear en vechtsportuitrusting van het Poolse merk Octagon: bokshandschoenen, scheenbeschermers, rashguards, MMA- en kickboksshorts. Gratis verzending in Nederland vanaf €99." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OctagonSportNL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OctagonSportNL | Octagon Fightwear & Vechtsport Uitrusting" />
    <meta name="twitter:description" content="Fightwear en vechtsportuitrusting van het Poolse merk Octagon: bokshandschoenen, scheenbeschermers, rashguards, MMA- en kickboksshorts. Gratis verzending in Nederland vanaf €99." />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta property="og:image" content="/brand/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#FFFFFF] antialiased selection:bg-[#D71920] selection:text-white">
    <!-- Netlify Forms: ukryte formularze, żeby Netlify wykrył pola (prawdziwe formularze są w React) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="department" /><input name="orderNumber" /><textarea name="message"></textarea><input name="language" />
    </form>
    <form name="clubs" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="clubName" /><input name="contactPerson" /><input name="email" /><input name="phone" /><input name="athletesCount" /><input name="discipline" /><input name="productsRequired" /><textarea name="message"></textarea><input name="language" />
    </form>
    <form name="wholesale" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="company" /><input name="kvk" /><input name="vat" /><input name="address" /><input name="website" /><input name="contactPerson" /><input name="phone" /><input name="email" /><input name="volume" /><textarea name="message"></textarea><input name="language" />
    </form>
    <form name="partner" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="type" /><input name="name" /><input name="organisation" /><input name="email" /><input name="phone" /><input name="city" /><input name="social" /><textarea name="message"></textarea><input name="language" />
    </form>
    <!-- Netlify Forms: deklaracja formularza newslettera (wysyłany z aplikacji React) -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" /><input name="source" /><input name="lang" /><input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
